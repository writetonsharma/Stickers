<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="212mm" height="134mm" viewBox="0 0 2120 1340" role="img" aria-labelledby="title desc">
  <title id="title">Tranché garlic and herb butter — connected jar label, draft fit proof</title>
  <desc id="desc">48 mm logo head joined by a 30 by 16 mm strip to a 206 by 50 mm three-section wrap, with original herb illustration and WhatsApp ordering QR. Draft only; regulatory copy, shelf life and Facebook handle pending.</desc>
  <defs>
    <clipPath id="lid"><circle cx="1060" cy="270" r="225"/></clipPath>
    <clipPath id="body"><rect x="30" y="810" width="2060" height="500" rx="35"/></clipPath>
    <g id="herb" fill="#e0e3cf" stroke="#6e7750" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 120Q-5 20 20-110" fill="none"/>
      <path d="M0 60Q-70 58-68 9Q-12 5 0 60Z M3 29Q67 23 77-25Q21-35 3 29Z M10-20Q-47-27-46-72Q8-70 10-20Z M17-65Q64-70 67-112Q26-118 17-65Z"/>
    </g>
  </defs>
  <!-- Finished-size concept, no bleed or production dieline. 10 SVG units = 1 mm. -->
  <g id="connected-label">
    <rect x="980" y="510" width="160" height="300" fill="#6e7750"/>
    <circle cx="1060" cy="270" r="240" fill="#faf7f2"/>
    <rect x="30" y="810" width="2060" height="500" rx="35" fill="#faf7f2"/>
  </g>
  <image x="835" y="45" width="450" height="450" href="../../logo/Logo.PNG" xlink:href="../../logo/Logo.PNG" preserveAspectRatio="xMidYMid slice" clip-path="url(#lid)"/>
  <circle cx="1060" cy="270" r="232" fill="none" stroke="#c69c6d" stroke-width="2"/>
  <g transform="translate(730 0)" fill="none" stroke="#e2d2b8" stroke-width="2">
    <path d="M270 550V786 M390 550V786"/>
    <path d="M330 575V776 M330 617Q297 617 299 590Q328 592 330 617 M330 660Q363 660 361 633Q332 635 330 660 M330 703Q297 703 299 676Q328 678 330 703"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="1403" y="810" width="687" height="500" fill="#f0ecdf"/>
    <use xlink:href="#herb" transform="translate(65 1280) rotate(-30) scale(1.2)" opacity=".16"/>
    <use xlink:href="#herb" transform="translate(2045 1270) rotate(20)" opacity=".12"/>
  </g>
  <rect x="44" y="824" width="2032" height="472" rx="25" fill="none" stroke="#c69c6d" stroke-width="2"/>
  <path d="M717 840V1280 M1403 840V1280" stroke="#c69c6d" stroke-width="2"/>
  <!-- Centre section: product name and illustration below the lid head. -->
  <g id="product-section" transform="translate(730 0)" text-anchor="middle" fill="#5a3e2b">
    <text x="330" y="867" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="3" fill="#6e7750">FROM OUR KITCHEN</text>
    <text x="330" y="925" font-family="Georgia, 'Times New Roman', serif" font-size="53">Garlic &amp; Herb</text>
    <text x="330" y="980" font-family="Georgia, 'Times New Roman', serif" font-size="53">Butter</text>
    <use xlink:href="#herb" transform="translate(320 1080) rotate(15) scale(.85)"/>
    <path d="M242 1160l24-70 118 8 28 66z" fill="#eddbbc" stroke="#c69c6d" stroke-width="3"/>
    <path d="M266 1090l31-22 117 9-30 21 M384 1098l30-21 29 66-31 21" fill="#f5e6c9" stroke="#c69c6d" stroke-width="3"/>
    <rect x="100" y="1195" width="460" height="52" rx="26" fill="#6e7750"/>
    <text x="330" y="1229" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#ffffff">KEEP REFRIGERATED</text>
    <text x="330" y="1273" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">A little jar of savoury goodness.</text>
  </g>
  <!-- Left section: explicit draft declarations and writable batch fields. -->
  <g id="details-section" transform="translate(-600 0)" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2b2b2b">
    <text x="675" y="867" fill="#6e7750" font-size="24" font-weight="700" letter-spacing="2">THE DETAILS</text>
    <text x="675" y="904" font-weight="700">INGREDIENTS &amp; ALLERGENS</text>
    <text x="675" y="929">Final copy pending. Contains milk.</text>
    <text x="675" y="966" font-weight="700">NUTRITION &amp; STORAGE</text>
    <text x="675" y="992">Nutrition / shelf-life review pending.</text>
    <path d="M675 1015H1310" stroke="#c69c6d" stroke-width="2"/>
    <text x="675" y="1048">Net qty. ______ g</text><text x="675" y="1080">Batch ___________________</text>
    <text x="675" y="1112">Packed on _______________</text>
    <text x="675" y="1145">Use by __________________</text>
    <text x="675" y="1177">MRP ₹ ______ (incl. all taxes)</text>
    <text x="675" y="1215" font-weight="700">Tranché Artisan Bakery</text>
    <text x="675" y="1241">FSSAI Lic. No. 20826005005996</text>
    <text x="675" y="1273" font-size="21" font-weight="700" fill="#884b36">LAYOUT PROOF · NOT FOR SALE</text>
  </g>
  <!-- Section 3: ordering QR, not the customer-care number. -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#2b2b2b">
    <text x="1747" y="867" font-size="24" font-weight="700" letter-spacing="2" fill="#6e7750">MORE FROM TRANCHÉ</text>
    <image x="1627" y="885" width="240" height="240" href="../Assets/WhatsApp-Order-QR.png" xlink:href="../Assets/WhatsApp-Order-QR.png"/>
    <text x="1747" y="1145" font-size="23" font-weight="700">Scan to order on WhatsApp</text>
    <text x="1747" y="1172" font-size="23">+91 88002 06057</text>
    <text x="1747" y="1202" font-size="25">tranchebakery.in</text>
    <text x="1747" y="1228" font-size="22">Instagram · @tranchebakery</text>
    <text x="1747" y="1253" font-size="22" fill="#71675e">Facebook · handle to confirm</text>
    <text x="1747" y="1278" font-size="20">Care · +91 87967 70308</text>
  </g>
</svg>