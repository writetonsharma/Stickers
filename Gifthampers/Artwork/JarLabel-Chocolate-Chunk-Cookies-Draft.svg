  <title id="title">Tranché dark couverture chocolate chunk cookies — connected jar label, draft fit proof</title>
  <desc id="desc">48 mm logo head joined by a 46 by 16 mm strip to a 256 by 72 mm three-section wrap. Handmade dark couverture chocolate chunk cookies, original cookie illustrations and WhatsApp ordering QR. Measured jar circumference is approximately 265 mm, leaving approximately 9 mm visible gap. Dimensions finalized; content remains a draft pending recipe and regulatory approval.</desc>
