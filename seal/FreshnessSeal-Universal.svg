<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="150mm" viewBox="0 0 500 1500" role="img" aria-labelledby="title description">
  <title id="title">TRANCHE universal freshness seal</title>
  <description id="description">A 50 by 150 millimetre writable seal with product, packed-on and net-weight fields.</description>

  <rect width="500" height="1500" fill="#faf7f2"/>
  <rect x="20" y="20" width="460" height="1460" rx="6" fill="none" stroke="#5a3e2b" stroke-width="3"/>

  <g fill="#2b2b2b" font-family="Arial, Helvetica, sans-serif">
    <text x="250" y="145" fill="#5a3e2b" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="4" text-anchor="middle">TRANCHÉ</text>
    <text x="250" y="190" fill="#6e7750" font-size="17" font-weight="700" letter-spacing="4" text-anchor="middle">ARTISAN BAKERY</text>

    <line x1="145" y1="255" x2="225" y2="255" stroke="#5a3e2b" stroke-width="2"/>
    <circle cx="250" cy="255" r="6" fill="#5a3e2b"/>
    <line x1="275" y1="255" x2="355" y2="255" stroke="#5a3e2b" stroke-width="2"/>

    <text x="250" y="365" fill="#5a3e2b" font-size="50" font-weight="700" letter-spacing="8" text-anchor="middle">SEALED</text>
    <text x="250" y="435" fill="#5a3e2b" font-size="50" font-weight="700" letter-spacing="8" text-anchor="middle">FRESH</text>
    <text x="250" y="490" fill="#6e7750" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">KEEP THE INNER BAG SEALED</text>

    <line x1="65" y1="555" x2="435" y2="555" stroke="#c69c6d" stroke-width="2"/>

    <text x="65" y="650" fill="#6e7750" font-size="18" font-weight="700" letter-spacing="2">PRODUCT</text>
    <line x1="65" y1="715" x2="435" y2="715" stroke="#5a3e2b" stroke-width="2"/>

    <text x="65" y="835" fill="#6e7750" font-size="18" font-weight="700" letter-spacing="2">PACKED ON</text>
    <line x1="65" y1="900" x2="435" y2="900" stroke="#5a3e2b" stroke-width="2"/>

    <text x="65" y="1020" fill="#6e7750" font-size="18" font-weight="700" letter-spacing="2">NET WEIGHT</text>
    <line x1="65" y1="1085" x2="390" y2="1085" stroke="#5a3e2b" stroke-width="2"/>
    <text x="410" y="1080" fill="#5a3e2b" font-size="24" font-weight="700">g</text>

    <line x1="65" y1="1190" x2="435" y2="1190" stroke="#c69c6d" stroke-width="2"/>

    <text x="250" y="1285" fill="#5a3e2b" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="1" text-anchor="middle">HANDCRAFTED BREAD</text>
    <text x="250" y="1340" fill="#6e7750" font-size="18" font-weight="700" letter-spacing="1" text-anchor="middle">tranchebakery.in</text>
    <text x="250" y="1390" fill="#6e7750" font-size="17" text-anchor="middle">@tranchebakery</text>
  </g>
</svg>
