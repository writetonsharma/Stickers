<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100mm" height="150mm" viewBox="0 0 1000 1500">

  <rect width="1000" height="1500" fill="#faf7f2"/>
  <rect x="20" y="20" width="960" height="1460" rx="8" fill="none" stroke="#5a3e2b" stroke-width="2"/>

  <g fill="#2b2b2b" font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="70" fill="#5a3e2b" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="3">TRANCHÉ</text>
    <text x="40" y="98" fill="#6e7750" font-size="14" font-weight="700" letter-spacing="2">ARTISAN BAKERY</text>

    <text x="40" y="151" fill="#5a3e2b" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700">Milk &amp; Butter Loaf</text>
    <text x="40" y="183" font-size="20">Soft enriched loaf made with milk, cream and butter</text>

    <g transform="translate(895 50)">
      <rect width="60" height="60" fill="#ffffff" stroke="#008a3b" stroke-width="5"/>
      <circle cx="30" cy="30" r="15" fill="#008a3b"/>
    </g>

    <line x1="40" y1="210" x2="960" y2="210" stroke="#c69c6d" stroke-width="2"/>

    <text x="40" y="245" fill="#6e7750" font-size="17" font-weight="700" letter-spacing="1.5">INGREDIENTS</text>
    <text x="40" y="274" font-size="18"><tspan x="40" y="274">Wheat flour blend (refined wheat flour, whole wheat flour and vital wheat gluten), filtered</tspan><tspan x="40" y="298">water, milk, cream, butter, sugar, milk powder, salt and instant yeast.</tspan></text>

    <text x="40" y="350" fill="#6e7750" font-size="17" font-weight="700" letter-spacing="1.5">ALLERGEN INFORMATION</text>
    <text x="40" y="382" font-size="20" font-weight="700">Contains wheat, gluten and milk.</text>
    <text x="40" y="412" font-size="19">Made in a kitchen that also handles milk and milk products, tree nuts, soy, sesame and other seeds.</text>

    <line x1="40" y1="440" x2="960" y2="440" stroke="#c69c6d" stroke-width="2"/>

    <text x="40" y="476" fill="#6e7750" font-size="17" font-weight="700" letter-spacing="1.5">NUTRITION INFORMATION</text>
    <text x="960" y="476" font-size="18" text-anchor="end">Approximate values per 100 g</text>

    <g font-size="21">
      <rect x="40" y="500" width="920" height="336" fill="#ffffff" stroke="#5a3e2b" stroke-width="1.5"/>
      <line x1="655" y1="500" x2="655" y2="836" stroke="#5a3e2b" stroke-width="1"/>
      <line x1="40" y1="542" x2="960" y2="542" stroke="#5a3e2b" stroke-width="1"/>
      <line x1="40" y1="584" x2="960" y2="584" stroke="#eadfce" stroke-width="1"/>
      <line x1="40" y1="626" x2="960" y2="626" stroke="#eadfce" stroke-width="1"/>
      <line x1="40" y1="668" x2="960" y2="668" stroke="#eadfce" stroke-width="1"/>
      <line x1="40" y1="710" x2="960" y2="710" stroke="#eadfce" stroke-width="1"/>
      <line x1="40" y1="752" x2="960" y2="752" stroke="#eadfce" stroke-width="1"/>
      <line x1="40" y1="794" x2="960" y2="794" stroke="#eadfce" stroke-width="1"/>

      <text x="58" y="528" font-weight="700">Nutrient</text>
      <text x="940" y="528" font-weight="700" text-anchor="end">Per 100 g</text>
      <text x="58" y="570">Energy</text><text x="940" y="570" text-anchor="end">267 kcal</text>
      <text x="58" y="612">Protein</text><text x="940" y="612" text-anchor="end">8.7 g</text>
      <text x="58" y="654">Carbohydrate</text><text x="940" y="654" text-anchor="end">44.4 g</text>
      <text x="78" y="696">Total sugars / Added sugars</text><text x="940" y="696" text-anchor="end">4.6 g / 2.7 g</text>
      <text x="58" y="738">Total fat</text><text x="940" y="738" text-anchor="end">6.1 g</text>
      <text x="78" y="780">Saturated fat / Trans fat</text><text x="940" y="780" text-anchor="end">3.5 g / 0.2 g</text>
      <text x="58" y="822">Sodium</text><text x="940" y="822" text-anchor="end">445 mg</text>
    </g>

    <line x1="40" y1="858" x2="960" y2="858" stroke="#c69c6d" stroke-width="2"/>

    <text x="40" y="895" fill="#6e7750" font-size="17" font-weight="700" letter-spacing="1.5">STORAGE</text>
    <text x="40" y="927" font-size="21">Store sealed in a cool, dry place. Do not refrigerate.</text>
    <text x="40" y="956" font-size="20">Freezing and detailed care: tranchebakery.in/faq.html#storage-guide</text>

    <rect x="40" y="985" width="920" height="172" rx="5" fill="#ffffff" stroke="#5a3e2b" stroke-width="1.5"/>
