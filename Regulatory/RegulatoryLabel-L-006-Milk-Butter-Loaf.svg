      <text x="60" y="1105">Best before</text><line x1="185" y1="1109" x2="480" y2="1109" stroke="#2b2b2b" stroke-width="1"/>
      <text x="515" y="1105">Net Qty.</text><line x1="603" y1="1109" x2="715" y2="1109" stroke="#2b2b2b" stroke-width="1"/><text x="725" y="1105">g</text>
