    <text x="40" y="274" font-size="17"><tspan x="40" y="274">Refined wheat flour, dark chocolate couverture*, sugar, whole milk, almonds (tree nuts),</tspan><tspan x="40" y="298">butter, raising agent (sodium bicarbonate [INS 500(ii)]), salt and natural vanilla.</tspan><tspan x="40" y="322">*Contains soya lecithin; full couverture declaration retained in the product record.</tspan></text>
